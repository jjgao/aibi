[project]
name = "aibi"
version = "0.0.1"
description = "AI-native cohort exploration over related tables"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "packaging>=24",
    "pyarrow>=20",
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "hypothesis>=6.116",  # its built-in "ci" profile loads when CI is set
    "import-linter>=2.1",
    "jsonschema>=4.23",
    "pyarrow-stubs>=20",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aibi"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# INP: a directory of modules without __init__.py is invisible to import-linter and pkgutil.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "TID", "INP"]
# The spec's typography (section ranges, minus signs) appears in docstrings.
allowed-confusables = ["–", "−"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001"]  # tests are collected in importlib mode, without packages

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/aibi/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.importlinter]
root_package = "aibi"

[[tool.importlinter.contracts]]
name = "The core does not import packs (SPEC P8)"
type = "forbidden"
source_modules = ["aibi.core"]
forbidden_modules = ["aibi.packs"]
