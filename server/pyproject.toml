[project]
name = "aibi"
version = "0.0.1"
description = "AI-native cohort exploration over related tables"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "duckdb>=1.5.5,<1.6",  # a new DuckDB can change a digest: bump the versions it changes (§7.6)
    # The scanners a Postgres or MySQL snapshot loads, DuckDB's own signed builds, one per DuckDB
    # version, which DuckDB checks the signature of when it loads them (D306).
    "duckdb-extension-mysql-scanner==1.5.5",
    "duckdb-extension-postgres-scanner==1.5.5",
    "fastapi>=0.141",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "mcp>=1.30,<2",
    "packaging>=24",
    "pyarrow>=20",
    "pydantic>=2.11",
    "python-calamine>=0.8.2",
    "sqlglot>=30.19,<31",
    "uvicorn>=0.53,<0.54",  # api.connections reads its h11 protocol's internals: a test pins them
]

[project.scripts]
aibi = "aibi.core.operator.cli:main"
aibi-server = "aibi.core.api.serve:main"

[dependency-groups]
dev = [
    "hypothesis>=6.116",  # its built-in "ci" profile loads when CI is set
    "import-linter>=2.1",
    "pyarrow-stubs>=20",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aibi"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# INP: a directory of modules without __init__.py is invisible to import-linter and pkgutil.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "TID", "INP"]
# The spec's typography (section ranges, minus signs) appears in docstrings.
allowed-confusables = ["–", "−"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001"]  # tests are collected in importlib mode, without packages

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/aibi/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
markers = [
    "databases: needs a Postgres or MySQL server, named by AIBI_TEST_POSTGRES_URL or AIBI_TEST_MYSQL_URL",
]
filterwarnings = [
    "error",
    # Starlette's TestClient prefers httpx2 and warns once, on import, when it runs on httpx, which
    # the operator CLI uses (D268); the tests hand the CLI a TestClient.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.importlinter]
root_package = "aibi"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core does not import packs (SPEC P8)"
type = "forbidden"
source_modules = ["aibi.core"]
forbidden_modules = ["aibi.packs"]

[[tool.importlinter.contracts]]
name = "The store does not import the importers, so the gate stays with the store (SPEC §13.2)"
type = "forbidden"
source_modules = ["aibi.core.store"]
forbidden_modules = ["aibi.core.importers"]

[[tool.importlinter.contracts]]
name = "The service layers know no HTTP layer or web framework (SPEC §12.1)"
type = "forbidden"
source_modules = [
    "aibi.core.schema",
    "aibi.core.store",
    "aibi.core.importers",
    "aibi.core.engine",
    "aibi.core.catalog",
]
forbidden_modules = [
    "aibi.core.api",
    "aibi.core.operator",
    "fastapi",
    "starlette",
    "uvicorn",
    "httpx",
    "anyio",
]

[[tool.importlinter.contracts]]
name = "Only a query worker's child and an import's snapshot load DuckDB (SPEC §14, D293, D306)"
type = "forbidden"
source_modules = ["aibi.core", "aibi.packs"]
forbidden_modules = ["duckdb"]
# importers.snapshot imports DuckDB inside the functions its import's worker calls, and only for
# type checking at its top: tests/core/importers/test_databases.py checks that the server's
# process never loads it.
ignore_imports = ["aibi.core.engine.duck -> duckdb", "aibi.core.importers.snapshot -> duckdb"]

[[tool.importlinter.contracts]]
name = "Operator operations are never tools (SPEC §11.2, A4, D278)"
type = "forbidden"
source_modules = ["aibi.core.catalog", "aibi.core.mcp"]
forbidden_modules = [
    "aibi.core.operator",
    "aibi.core.importers",
    "aibi.core.store.sessions",
    "aibi.core.store.erasure",
    "aibi.core.api",
]

[[tool.importlinter.contracts]]
name = "The operator CLI talks to the server over HTTP only (SPEC §11.2, D268)"
type = "forbidden"
source_modules = [
    "aibi.core.operator.cli",
    "aibi.core.operator.client",
    "aibi.core.operator.auth",
]
forbidden_modules = [
    "aibi.core.store",
    "aibi.core.importers",
    "aibi.core.engine",
    "aibi.core.api",
    "aibi.core.operator.router",
    "fastapi",
    "starlette",
    "uvicorn",
]
# Annotations under TYPE_CHECKING, which the CLI never runs; tests/core/operator/test_cli.py
# checks in a fresh interpreter that the CLI loads none of the forbidden modules.
ignore_imports = [
    "aibi.core.schema.pack_api -> aibi.core.engine.data",
    "aibi.core.schema.pack_api -> aibi.core.store.build",
    "aibi.core.schema.pack_api -> aibi.core.store.sources",
]

[[tool.importlinter.contracts]]
name = "The HTTP application imports the operator surface, never the reverse (SPEC §12.5)"
type = "forbidden"
source_modules = ["aibi.core.operator"]
forbidden_modules = ["aibi.core.api"]
