name: CI

# A stacked PR is not checked again when GitHub retargets it after its parent merges: an
# `edited` trigger would also fire on every title or description edit, and that run would cancel
# or shadow the real one. Rebase the child onto its new base and push instead; the push re-runs CI.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its superseded run. Every push to main gets a group of its own, so
  # no commit on main goes unchecked.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  server:
    name: Server checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Import boundary
        run: uv run lint-imports
      - name: Core tests, which must load no pack (SPEC P8)
        run: uv run pytest tests/core --tb=short -o junit_family=xunit1 --junitxml=reports/core.xml
      - name: Other tests
        # pytest exits with 5 when it collects no tests, as before the first pack has any.
        run: >-
          uv run pytest --ignore=tests/core --tb=short -o junit_family=xunit1
          --junitxml=reports/other.xml || test $? -eq 5
      - name: Failed tests as annotations
        # Each failed test's id, place and message becomes a check-run annotation, which the
        # checks API serves where the job's log cannot be read (D334).
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET

          def escaped(value, member=False):
              value = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return value.replace(":", "%3A").replace(",", "%2C") if member else value

          reports = sorted(glob.glob("reports/*.xml"))
          found = []
          for report in reports:
              for case in ET.parse(report).iter("testcase"):
                  for failed in [*case.findall("failure"), *case.findall("error")]:
                      name = "::".join(p for p in (case.get("classname"), case.get("name")) if p)
                      where = f"server/{case.get('file', '')}"
                      line = int(case.get("line") or 0) + 1
                      said = f"{failed.get('message') or ''}\n{failed.text or ''}".strip()
                      found.append(
                          f"::error file={escaped(where, True)},line={line},"
                          f"title={escaped(name[:200], True)}::{escaped(said[:4000])}"
                      )
          # A step keeps 10 error annotations: past that, one says how many the rest are.
          if len(found) > 10:
              print(f"::error title={len(found)} failed::{len(found)} tests failed; the first 9 "
                    "are annotated, and the job's log holds the rest")
              found = found[:9]
          if found:
              print(*found, sep="\n")
          if not reports:
              print("::error title=No report::pytest wrote no report: a step before the tests "
                    "failed, or pytest stopped before writing one")
          elif not found:
              print("::error title=No failed test::No test failed in pytest's reports: a check "
                    "of the whole session failed, or a step outside the tests did")
          EOF
