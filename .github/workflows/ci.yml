name: CI

# A stacked PR is not checked again when GitHub retargets it after its parent merges: an
# `edited` trigger would also fire on every title or description edit, and that run would cancel
# or shadow the real one. Rebase the child onto its new base and push instead; the push re-runs CI.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its superseded run. Every push to main gets a group of its own, so
  # no commit on main goes unchecked.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    # Lint, format, types and the import boundary, once, beside the tests: about a minute and a
    # half, pyright 30 to 56 seconds of it (D340).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        timeout-minutes: 10
        run: uv run pyright
      - name: Import boundary
        run: uv run lint-imports

  core:
    name: Core tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    # tests/core in three shards of whole directories, given to pytest as paths (never --ignore,
    # -k or a deselection: those turn D422's pin guard off, or make it ask for pins another shard
    # runs), so that each shard's session still fails when it loads a pack (P8) or a pin it
    # collected did not run (D422); tests/core/determinism and tests/core/domain run in jobs of
    # their own, and tests/core/test_package.py checks that every other directory runs in
    # exactly one shard. The whole suite took 47.3 minutes in one serial run on four
    # processors (issue #135's survey): 15.8, 15.5 and 15.8 of it in these shards, about a
    # third of CI's 39 to 52 minutes for the whole (13 to 17.5). D449 runs the engine's
    # differential tests by both paths and moves operator to shard 2: summed locally under
    # contention, the shards took about 20, 20 and 26 minutes, so CI's minutes on the pull
    # request decide whether another directory moves. The step's limit is 30 and the job's 40,
    # and the step's own limit leaves the annotations' step time to run when it is reached
    # (D340).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            tests: tests/core/analyses tests/core/schema tests/core/measurement
          - shard: 2
            tests: >-
              tests/core/importers tests/core/catalog tests/core/mcp tests/core/operator
              tests/core/test_*.py
          - shard: 3
            tests: tests/core/engine tests/core/api tests/core/store
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch's tip is read below (the server's wording, D399), without credentials.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: The base branch's wording (D374, D399)
        # tests/core/test_wording.py and test_text_projection.py compare the server's wording with
        # the base's: the checked-in files are consistent with themselves, so a change of a
        # template, or of a result's text, with CACHE_WORDING untouched and the files written
        # again passes them and fails against the base's copies. A stacked pull request's base is
        # its parent's branch, which is the right one. A file the base lacks is one this change
        # introduces. Every shard reads it, whichever holds those tests.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        working-directory: .
        run: |
          set -eu
          git rev-parse --verify "origin/${BASE_REF}^{commit}"
          mkdir -p "${RUNNER_TEMP}/wording-base"
          for path in server/tests/core/wording.json server/tests/core/analyses/golden/text_projection.json; do
            if git cat-file -e "origin/${BASE_REF}:${path}"; then
              git show "origin/${BASE_REF}:${path}" > "${RUNNER_TEMP}/wording-base/$(basename "${path}")"
            fi
          done
          echo "AIBI_WORDING_BASE=${RUNNER_TEMP}/wording-base" >> "${GITHUB_ENV}"
      - name: Core tests, which must load no pack (SPEC P8)
        id: core
        timeout-minutes: 30
        run: >-
          uv run pytest ${{ matrix.tests }} --tb=short -o junit_family=xunit1
          --junitxml=reports/core-${{ matrix.shard }}.xml
      - name: Failed tests as annotations
        # Each failed test's id, place and message becomes a check-run annotation, which the
        # checks API serves where the job's log cannot be read (D334).
        if: failure()
        env:
          OUTCOMES: "Core tests, shard ${{ matrix.shard }}=${{ steps.core.outcome }}"
        run: python3 ../.github/scripts/annotations.py

  other:
    name: Other tests
    # Every test outside tests/core (the pack suites): 8.6 minutes on #172's run and 12.8 on
    # #174's, and M4.2b-2b-ii-a adds about 2 minutes, within the step's 20; the job has 25 (D340).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Other tests
        id: other
        timeout-minutes: 20
        # pytest exits with 5 when it collects no tests, as before the first pack has any.
        run: >-
          uv run pytest --ignore=tests/core --tb=short -o junit_family=xunit1
          --junitxml=reports/other.xml || test $? -eq 5
      - name: Failed tests as annotations
        # As the core shards' (D334).
        if: failure()
        env:
          OUTCOMES: "Other tests=${{ steps.other.outcome }}"
        run: python3 ../.github/scripts/annotations.py

  server:
    name: Server checks
    # One check for the server's static checks, its core shards and its other tests, under the
    # name the single server job had, and for the domain of grouped coverage (D449): it runs
    # whatever they did (a failed job would otherwise skip it, and a skipped check passes) and
    # fails unless each of them succeeded, so a failed, cancelled or skipped one fails it;
    # tests/core/test_package.py holds it to that.
    needs: [static, core, other, domain]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every server job succeeded
        env:
          STATIC: ${{ needs.static.result }}
          CORE: ${{ needs.core.result }}
          OTHER: ${{ needs.other.result }}
          DOMAIN: ${{ needs.domain.result }}
        # The step fails, with an annotation naming each job's result (D334), unless all four
        # succeeded, with or without the shell's -e. The results are GitHub's own words.
        run: |
          echo "static: ${STATIC}; core: ${CORE}; other: ${OTHER}; domain: ${DOMAIN}"
          test "${STATIC}" = success && test "${CORE}" = success && test "${OTHER}" = success && test "${DOMAIN}" = success || {
            echo "::error title=Server checks::static ${STATIC}; core ${CORE}; other ${OTHER}; domain ${DOMAIN}"
            exit 1
          }

  domain:
    name: The domain of grouped coverage
    # The one-group path of grouped coverage held to the evaluator over a derived domain, and
    # its cost cells against main's path (D449): about 8.5 to 10 minutes of domain and 3.5 to 4
    # of cells (measured locally under contention), on a runner of their own; the step has 25
    # minutes and the job 30 (D340).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: The domain of grouped coverage (SPEC D449)
        id: domain
        timeout-minutes: 25
        run: >-
          uv run pytest tests/core/domain -m domain --durations=0 --tb=short
          -o junit_family=xunit1 --junitxml=reports/domain.xml
      - name: Every domain test ran and passed
        run: python3 ../.github/scripts/domain_report.py reports/domain.xml
      - name: Failed tests as annotations
        if: failure()
        env:
          OUTCOMES: "Domain tests=${{ steps.domain.outcome }}"
        run: python3 ../.github/scripts/annotations.py

  determinism:
    name: Determinism at a million rows
    # The thread-count determinism tests of §9.3 (D372), on a runner of their own beside the
    # server checks: they build a release of a million trees once (about a minute and 2 GB) and
    # run each call at several DuckDB thread counts.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Thread-count determinism tests (SPEC §9.3)
        id: million
        timeout-minutes: 20
        run: >-
          uv run pytest tests/core/determinism -m million --durations=0 --tb=short
          -o junit_family=xunit1 --junitxml=reports/determinism.xml
      - name: Every determinism test ran and passed
        run: python3 ../.github/scripts/determinism_report.py reports/determinism.xml
      - name: Failed tests as annotations
        if: failure()
        env:
          OUTCOMES: "Determinism tests=${{ steps.million.outcome }}"
        run: python3 ../.github/scripts/annotations.py

  mutation:
    name: The retention guards' mutants (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    # D438's mutation table (tests/packs/onco/retention_mutants/table.py), replayed against a copy
    # of the tree on runners of their own beside the server checks: each mutant's marker scan (a
    # fresh interpreter, about 13 s), its source guard and the tests it names, one mutant a
    # processor at a time. The whole table took 17.8 to 36.5 minutes on one runner's four
    # processors, which vary (17.8 and 26.6 on main's pushes, 36.5 on a pull request's runner);
    # each leg replays the control and half of the table (mutation_report.dealt, by
    # AIBI_MUTANT_SHARD), about 9.5 to 19 minutes (D438's figure); its step has 25 minutes and
    # the job 30 (D340). Each leg's report holds its share (mutation_report.py --shard), and the
    # legs together are the table: tests/packs/onco/test_retention_mutants.py holds the matrix to
    # legs 1 to n.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      AIBI_MUTANT_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: The retention guards' mutation table (SPEC D438)
        id: mutation
        timeout-minutes: 25
        run: >-
          uv run pytest tests/packs/onco/test_retention_mutants.py -m mutation --durations=0
          --tb=short -o junit_family=xunit1 --junitxml=reports/mutation.xml
      - name: Every mutant of the shard was replayed
        run: python3 ../.github/scripts/mutation_report.py reports/mutation.xml --shard "${AIBI_MUTANT_SHARD}"
      - name: Failed tests as annotations
        if: failure()
        env:
          OUTCOMES: "Mutation tests, shard ${{ matrix.shard }}=${{ steps.mutation.outcome }}"
        run: python3 ../.github/scripts/annotations.py

  web:
    name: Web checks
    # The web package (D418, D419): its licences and advisories, the generated API types against
    # the checked-in OpenAPI document, types, lint and tests, both builds
    # through the build's gate and check-bundle (which runs the real loader), and the policy
    # matrix in Chromium against the built bundles served by the real server.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install Python and the server, which check-bundle and the matrix run
        working-directory: server
        run: |
          uv python install
          uv sync --locked
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts
      - name: Licences, from the committed lockfile
        run: npm run licenses
      - name: Advisories in the runtime closure
        run: npm audit --omit=dev --audit-level=high
      - name: The generated API types are those of schemas/openapi.json, and SPEC's Appendix C is the display table's (D427)
        run: npm run generate:check
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and build tests
        run: npm test
      - name: The lint tests in two shuffled orders (each lint sees the package's own files)
        run: npm run test:shuffle
      - name: Build dist/ and check it (production)
        run: npm run build
      - name: Build dist-e2e/ and check it (end-to-end)
        run: npm run build:e2e
      - name: Playwright's version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: The policy matrix
        run: npm run e2e
      - name: Playwright's report, on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
