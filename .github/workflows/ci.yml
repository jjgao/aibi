name: CI

# A stacked PR is not checked again when GitHub retargets it after its parent merges: an
# `edited` trigger would also fire on every title or description edit, and that run would cancel
# or shadow the real one. Rebase the child onto its new base and push instead; the push re-runs CI.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its superseded run. Every push to main gets a group of its own, so
  # no commit on main goes unchecked.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  server:
    name: Server checks
    runs-on: ubuntu-latest
    # The core tests take about 14 minutes; the job's limit leaves them and every other step room,
    # and each test step's own limit leaves the annotations' step time to run when one is reached
    # (D340).
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch's tip is read below (the server's wording, D399), without credentials.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: The base branch's wording (D374, D399)
        # tests/core/test_wording.py and test_text_projection.py compare the server's wording with
        # the base's: the checked-in files are consistent with themselves, so a change of a
        # template, or of a result's text, with CACHE_WORDING untouched and the files written
        # again passes them and fails against the base's copies. A stacked pull request's base is
        # its parent's branch, which is the right one. A file the base lacks is one this change
        # introduces.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        working-directory: .
        run: |
          set -eu
          git rev-parse --verify "origin/${BASE_REF}^{commit}"
          mkdir -p "${RUNNER_TEMP}/wording-base"
          for path in server/tests/core/wording.json server/tests/core/analyses/golden/text_projection.json; do
            if git cat-file -e "origin/${BASE_REF}:${path}"; then
              git show "origin/${BASE_REF}:${path}" > "${RUNNER_TEMP}/wording-base/$(basename "${path}")"
            fi
          done
          echo "AIBI_WORDING_BASE=${RUNNER_TEMP}/wording-base" >> "${GITHUB_ENV}"
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Import boundary
        run: uv run lint-imports
      - name: Core tests, which must load no pack (SPEC P8)
        id: core
        timeout-minutes: 45
        run: uv run pytest tests/core --tb=short -o junit_family=xunit1 --junitxml=reports/core.xml
      - name: Other tests
        id: other
        timeout-minutes: 4
        # pytest exits with 5 when it collects no tests, as before the first pack has any.
        run: >-
          uv run pytest --ignore=tests/core --tb=short -o junit_family=xunit1
          --junitxml=reports/other.xml || test $? -eq 5
      - name: Failed tests as annotations
        # Each failed test's id, place and message becomes a check-run annotation, which the
        # checks API serves where the job's log cannot be read (D334).
        if: failure()
        env:
          OUTCOMES: "Core tests=${{ steps.core.outcome }};Other tests=${{ steps.other.outcome }}"
        run: python3 ../.github/scripts/annotations.py

  determinism:
    name: Determinism at a million rows
    # The thread-count determinism tests of §9.3 (D372), on a runner of their own beside the
    # server checks: they build a release of a million trees once (about a minute and 2 GB) and
    # run each call at several DuckDB thread counts.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Thread-count determinism tests (SPEC §9.3)
        id: million
        timeout-minutes: 20
        run: >-
          uv run pytest tests/core/determinism -m million --durations=0 --tb=short
          -o junit_family=xunit1 --junitxml=reports/determinism.xml
      - name: Every determinism test ran and passed
        run: python3 ../.github/scripts/determinism_report.py reports/determinism.xml
      - name: Failed tests as annotations
        if: failure()
        env:
          OUTCOMES: "Determinism tests=${{ steps.million.outcome }}"
        run: python3 ../.github/scripts/annotations.py
